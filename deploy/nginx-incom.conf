# Nginx : un bloc serveur dédié au domaine, à côté des autres sites du VPS.
# Remplacer VOTRE-DOMAINE.dz partout, copier dans /etc/nginx/sites-available/incom,
# activer avec un lien dans sites-enabled, puis : sudo nginx -t && sudo systemctl reload nginx
# Certbot ajoutera ensuite lui-même la partie HTTPS (port 443).
server {
    listen 80;
    listen [::]:80;
    server_name VOTRE-DOMAINE.dz www.VOTRE-DOMAINE.dz;

    client_max_body_size 5m;

    # API Node (Express) : http://127.0.0.1:4100/api/...
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site + CRM (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
